# Blueprint Render: https://render.com/docs/blueprint-spec
# Tras conectar el repo, Render pedirá ADMIN_PASSWORD; JWT_SECRET se genera solo.
# CORS: si no defines CORS_ORIGIN, la API usa RENDER_EXTERNAL_URL (lo inyecta Render).

services:
  - type: web
    name: tres-regiones
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
